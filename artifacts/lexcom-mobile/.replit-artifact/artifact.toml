kind = "mobile"
previewPath = "/lexcom-mobile/"
title = "LexCom Mobile"
version = "1.0.0"
id = "artifacts/lexcom-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/lexcom-mobile/" ]
localPort = 18837

[services.development]
run = "pnpm --filter @workspace/lexcom-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lexcom-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lexcom-mobile", "run", "serve" ]

[services.env]
PORT = "18837"
BASE_PATH = "/lexcom-mobile/"
