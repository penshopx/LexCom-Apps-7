<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b12" />
    <meta name="color-scheme" content="dark" />
    <title>LexCom · Tidak ada koneksi</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090b12;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 35%, rgba(124, 58, 237, 0.22), transparent 30rem),
          linear-gradient(145deg, #090b12 0%, #111827 100%);
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 18rem;
        height: 18rem;
        border: 1px solid rgba(96, 165, 250, 0.12);
        border-radius: 999px;
        pointer-events: none;
      }

      body::before {
        top: -11rem;
        right: -6rem;
      }

      body::after {
        bottom: -12rem;
        left: -7rem;
        border-color: rgba(167, 139, 250, 0.12);
      }

      main {
        position: relative;
        width: min(100% - 2rem, 31rem);
        padding: 2.25rem 1.5rem 2rem;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin-bottom: 2.75rem;
        color: #ffffff;
        font-size: 1.1rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }

      .brand-mark {
        display: grid;
        width: 2.35rem;
        height: 2.35rem;
        place-items: center;
        border-radius: 0.75rem;
        background: linear-gradient(135deg, #a78bfa, #6d28d9);
        box-shadow: 0 0.75rem 2rem rgba(109, 40, 217, 0.35);
      }

      .brand-mark svg {
        width: 1.4rem;
        height: 1.4rem;
      }

      .signal {
        position: relative;
        display: grid;
        width: 7rem;
        height: 7rem;
        margin: 0 auto 2rem;
        place-items: center;
        border: 1px solid rgba(167, 139, 250, 0.35);
        border-radius: 2rem;
        background: rgba(124, 58, 237, 0.12);
        color: #c4b5fd;
      }

      .signal::before,
      .signal::after {
        content: "";
        position: absolute;
        border: 1px solid rgba(167, 139, 250, 0.22);
        border-radius: 2.5rem;
      }

      .signal::before {
        inset: -0.85rem;
      }

      .signal::after {
        inset: -1.7rem;
        border-color: rgba(167, 139, 250, 0.1);
      }

      .signal svg {
        position: relative;
        z-index: 1;
        width: 3rem;
        height: 3rem;
      }

      h1 {
        margin: 0;
        color: #ffffff;
        font-size: clamp(1.8rem, 6vw, 2.4rem);
        line-height: 1.12;
        letter-spacing: -0.04em;
      }

      p {
        max-width: 26rem;
        margin: 1rem auto 0;
        color: #aab4c5;
        font-size: 1rem;
        line-height: 1.65;
      }

      .retry {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 10rem;
        min-height: 2.9rem;
        margin-top: 1.75rem;
        padding: 0.7rem 1.25rem;
        border: 0;
        border-radius: 0.8rem;
        background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 0.75rem 1.75rem rgba(109, 40, 217, 0.28);
        transition: transform 150ms ease, box-shadow 150ms ease;
      }

      .retry:hover {
        transform: translateY(-1px);
        box-shadow: 0 1rem 2rem rgba(109, 40, 217, 0.4);
      }

      .retry:focus-visible {
        outline: 3px solid #93c5fd;
        outline-offset: 3px;
      }

      .hint {
        margin-top: 1.5rem;
        color: #6f7c91;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="LexCom">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4v12a4 4 0 0 0 4 4h6" />
            <path d="M7 8h7" />
            <path d="m14 8 4 4-4 4" />
          </svg>
        </span>
        <span>LexCom</span>
      </div>

      <div class="signal" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8.8a15.8 15.8 0 0 1 20 0" />
          <path d="M5.3 12.3a10.6 10.6 0 0 1 13.4 0" />
          <path d="M8.7 15.8a5.4 5.4 0 0 1 6.6 0" />
          <path d="M12 20h.01" />
          <path d="m4 4 16 16" />
        </svg>
      </div>

      <h1>Koneksi sedang terputus</h1>
      <p>
        LexCom belum bisa terhubung ke internet. Periksa koneksi Anda, lalu coba
        muat ulang halaman untuk melanjutkan telaah hukum.
      </p>
      <button class="retry" type="button" onclick="window.location.reload()">
        Coba lagi
      </button>
      <p class="hint">Halaman ini akan tersedia kembali saat Anda online.</p>
    </main>
  </body>
</html>
